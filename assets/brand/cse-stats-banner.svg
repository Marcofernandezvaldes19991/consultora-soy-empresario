<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 250" role="img" aria-labelledby="title desc"><title id="title">Indicadores Consultora Soy Empresario</title><desc id="desc">Diez años de experiencia, tres áreas de asesoría, atención uno a uno y cien por ciento compromiso.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#073b74"/><stop offset="1" stop-color="#0b579a"/></linearGradient><style>.num{font:700 54px Manrope,Arial,sans-serif;fill:#fff}.head{font:700 19px Inter,Arial,sans-serif;fill:#fff}.sub{font:400 16px Inter,Arial,sans-serif;fill:#eef5fb}.icon{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#f7c51d;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accentfill{fill:#f7c51d}</style></defs><rect width="1600" height="250" fill="url(#bg)"/><g opacity=".2" stroke="#fff"><line x1="400" x2="400" y2="250"/><line x1="800" x2="800" y2="250"/><line x1="1200" x2="1200" y2="250"/></g><g transform="translate(45 46)"><g transform="translate(0 15)"><rect class="icon" x="0" y="35" width="92" height="62" rx="8"/><path class="icon" d="M28 35V22h36v13M0 58h92"/><rect class="accentfill" x="39" y="53" width="14" height="14" rx="2"/></g><text class="num" x="128" y="62">10+</text><text class="head" x="128" y="108">Años de experiencia</text><text class="sub" x="128" y="140">Acompañando a emprendedores</text><text class="sub" x="128" y="167">y empresas.</text></g><g transform="translate(445 46)"><g transform="translate(0 10)"><circle class="icon" cx="50" cy="35" r="16"/><circle class="icon" cx="18" cy="48" r="12"/><circle class="icon" cx="82" cy="48" r="12"/><path class="icon" d="M25 105V83c0-18 10-30 25-30s25 12 25 30v22M0 98V80c0-14 7-23 18-23 7 0 12 3 16 8M100 98V80c0-14-7-23-18-23-7 0-12 3-16 8"/><path class="accent" d="M34 35a16 16 0 0 1 32 0"/></g><text class="num" x="128" y="62">3</text><text class="head" x="128" y="108">Áreas de asesoría</text><text class="sub" x="128" y